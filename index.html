<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>7th semester Study Hub</title>
  <link rel="icon" href="logo.png" type="image/png">

  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #f3f0ff;
      --card: #fff;
      --ink: #1d2330;
      --mut: #667085;
      --line: #e4e0f5;
      --sc: #7c3aed;
      --sc2: #ec4899;
      --ok: #16a34a;
      --hi: #fff1c2;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14122a; --card: #1d1b36; --ink: #ecebff;
        --mut: #a5a3c9; --line: #2f2c55; --hi: #4a3d12;
      }
    }
    :root[data-theme="dark"] {
      --bg: #14122a; --card: #1d1b36; --ink: #ecebff;
      --mut: #a5a3c9; --line: #2f2c55; --hi: #4a3d12;
    }

    html { scroll-padding-top: env(safe-area-inset-top, 0px); }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    header {
      position: sticky; top: env(safe-area-inset-top, 0px);
      background: var(--card); border-bottom: 3px solid var(--sc); z-index: 5;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 0 14px; }
    .top {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0 6px; flex-wrap: wrap;
    }
    .logo {
      width: 10%; height: 34px; object-fit: contain;
      border-radius: 10px; flex: none; padding: 3px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      cursor: pointer;
      transition: transform .15s;
    }
    .logo:hover { transform: scale(1.08); }
    .logo:active { transform: scale(0.94); }

    .brand {
      display: flex; align-items: center; gap: 8px;
      flex: 1 1 auto; min-width: 0;
    }
    h1 {
      font-size: 18px; margin: 0;
      background: linear-gradient(90deg, var(--sc), var(--sc2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rb {
      display: flex; gap: 6px; flex-wrap: wrap;
      align-items: center; flex: 0 1 auto;
    }
    .room-chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line); background: var(--bg);
      border-radius: 99px; padding: 5px 12px;
      font-size: 13px; cursor: pointer;
      max-width: 100%;
    }
    .room-chip b {
      color: var(--sc); font-weight: 700;
      max-width: 160px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
    }
    .room-chip:hover { border-color: var(--sc); }

    select, input[type=text], #ms {
      border: 1px solid var(--line); background: var(--bg); color: var(--ink);
      border-radius: 8px; padding: 6px 8px; font: inherit;
      font-size: 13px; max-width: 100%;
    }

    /* ─── Tabs ─── */
    .tabs {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px;
      -webkit-overflow-scrolling: touch; scrollbar-width: thin;
    }
    .tab {
      flex: 1 0 auto; min-width: 118px; text-align: left;
      border: 2px solid transparent; background: var(--bg); color: var(--ink);
      border-radius: 12px; padding: 7px 10px; cursor: pointer; font: inherit;
    }
    .tab b { display: block; font-size: 13px; }
    .tab small { color: var(--mut); font-size: 11px; }
    .tab.on {
      background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff;
    }
    .tab.on small { color: #ffffffcc; }

    /* ─── Progress ─── */
    .bar {
      height: 7px; background: var(--line); border-radius: 9px;
      overflow: hidden; margin-top: 4px;
    }
    .bar i {
      display: block; height: 100%;
      background: linear-gradient(90deg, var(--c1, var(--sc)), var(--c2, var(--sc2)));
      width: 0; transition: width .3s;
    }
    .tab.on .bar { background: #ffffff55; }
    .tab.on .bar i { background: #fff; }

    /* ─── Buttons ─── */
    button.b {
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      border-radius: 8px; padding: 6px 10px; cursor: pointer;
      font: inherit; font-size: 13px; white-space: nowrap;
    }
    button.b:hover { border-color: var(--sc); }

    /* ─── Hero ─── */
    .hero {
      background: linear-gradient(135deg, var(--sc), var(--sc2));
      color: #fff; border-radius: 16px; padding: 16px; margin: 14px 0;
    }
    .hero h2 { margin: 0 0 2px; font-size: 20px; }
    .hero p { margin: 0 0 10px; opacity: .85; font-size: 14px; }
    .hero .bar { height: 14px; background: #ffffff44; }
    .hero .bar i { background: #fff; }
    .hero .b { background: #ffffff26; color: #fff; border-color: #ffffff66; }

    .row {
      display: flex; gap: 8px; align-items: center;
      flex-wrap: wrap; margin-top: 10px;
    }
    .big { font-size: 28px; font-weight: 800; }
    .empty { text-align: center; padding: 40px 10px; }

    /* ─── Members Panel ─── */
    .mem {
      background: var(--card); color: var(--ink);
      border: 2px solid var(--sc);
    }
    .mem .b { background: var(--card); color: var(--ink); }
    .mrow {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 6px 0; border-top: 1px solid var(--line);
    }
    .mrow small { color: var(--mut); flex: 1; }

    /* ─── Units ─── */
    details {
      background: var(--card); border: 1px solid var(--line);
      border-left: 6px solid var(--sc); border-radius: 12px;
      margin: 10px 0; overflow: hidden;
    }
    summary {
      cursor: pointer; padding: 12px 14px; font-weight: 600;
      display: flex; justify-content: space-between; gap: 10px;
      align-items: center; font-size: 15px;
    }
    summary span {
      font-size: 12px; color: #fff; background: var(--sc);
      border-radius: 99px; padding: 1px 9px; white-space: nowrap;
    }
    .in { padding: 0 14px 14px; }
    .syl {
      font-size: 14px; color: var(--mut); background: var(--bg);
      border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
    }

    /* ─── Questions ─── */
    .qw {
      display: flex; align-items: flex-start;
      border-top: 1px solid var(--line);
    }
    label.q {
      flex: 1; display: flex; gap: 10px; align-items: flex-start;
      padding: 9px 6px; cursor: pointer; min-width: 0;
    }
    label.q input {
      width: 20px; height: 20px; margin-top: 2px;
      accent-color: var(--ok); flex: none;
    }
    label.q span { word-break: break-word; }
    label.q.done span { text-decoration: line-through; color: var(--mut); }
    label.q.star span:before { content: "★ "; color: #f59e0b; }
    label.q.two { background: var(--hi); border-radius: 6px; }
    .clip { margin: 6px 0 0 4px; flex: none; }
    .clip.has { border-color: var(--sc); color: var(--sc); }

    /* ─── Notes / Files ─── */
    .qn {
      background: var(--bg); border-radius: 10px;
      padding: 10px; margin: 0 0 8px;
    }
    textarea {
      width: 100%; min-height: 80px;
      border: 1px solid var(--line); border-radius: 8px;
      background: var(--card); color: var(--ink);
      font: 14px/1.5 inherit; padding: 8px; resize: vertical;
    }
    .f {
      display: flex; gap: 6px; align-items: center;
      font-size: 13px; padding: 3px 0; word-break: break-all;
    }
    .f span { flex: 1; }

    /* ─── Toast ─── */
    #toast {
      position: fixed; left: 50%;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      transform: translateX(-50%);
      background: #111; color: #fff; border-radius: 9px;
      padding: 8px 14px; font-size: 13px; display: none;
      z-index: 9; max-width: 90vw; text-align: center;
    }

    /* ─── Mobile ─── */
    @media (max-width: 520px) {
      .wrap { padding: 0 10px; }
      .top { gap: 8px; padding: 8px 0 6px; }
      .logo { width: 40px; height: 40px; }
      h1 { font-size: 15px; }
      .rb { width: 100%; justify-content: flex-start; }
      .tab { min-width: 100px; padding: 6px 8px; }
      .tab b { font-size: 12px; }
      .big { font-size: 24px; }
      .hero { padding: 14px; border-radius: 14px; }
      .hero h2 { font-size: 17px; }
      summary { font-size: 14px; padding: 10px 12px; }
      .in { padding: 0 10px 12px; }
    }
    @media (max-width: 360px) {
      h1 { font-size: 14px; }
      .logo { width: 34px; height: 34px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="wrap">

    const S = [

      { c: "OTD352", n: "Traditional Indian Foods", u: [

          "Kosher and Halal foods: rules and significance",

        ]},
        { t: "Traditional Food Processing", s: "Traditional vs modern milling (rice, wheat, corn), oil extraction, paneer, butter, ghee, sun & osmotic drying, brining, pickling, smoking.", q: [

    const why = e => (e && e.code ? " [" + e.code + "] " : " ") + ((e && e.message) || "");
    const $ = s => document.querySelector(s);
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const qid = (i, j, k) => `${i}.${j}.${k}`;
    const parse = q => ({
      two: q.startsWith("2:"),
      star: q.startsWith("★"),
      txt: q.replace(/^2:|^★/, "")
    });

    /** Turn "My Study Group!" into "my-study-group" — a safe Firestore doc id */
    function slugify(name) {
      return name.trim().toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 60);
    }

    function prog(i) {
      let t = 0, d = 0;
      S[i].u.forEach((u, j) => u.q.forEach((q, k) => {
        t++;
        if (D.ck[qid(i, j, k)]) d++;
      }));
      return { t, d, p: t ? Math.round(d / t * 100) : 0 };
    }

    function toast(m) {
      const t = $("#toast");
      t.textContent = m;
      t.style.display = "block";
      clearTimeout(t._t);
      t._t = setTimeout(() => t.style.display = "none", 3200);
    }

    /* ─────────────────────────────────────────────────────
       6. PERSIST  (writes shared data to the room doc)
       ───────────────────────────────────────────────────── */
    function persist() {
      clearTimeout(timer);
      timer = setTimeout(async () => {
        if (!R) return;
        try {
          // Shared data → one doc per room
          await setDoc(doc(db, "roomdata", R.id), {
            ck: D.ck,
            nt: D.nt,
            fl: D.fl,
            updated: Date.now()
          }, { merge: true });

          // Local preferences (per device)
          try {
            localStorage.setItem("open_" + R.id, JSON.stringify(D.open));
            localStorage.setItem("pend_" + R.id, D.pend ? "1" : "0");
          } catch (e) {}
        } catch (e) {
          toast("Couldn't save: " + why(e));
        }
      }, 400);
    }

    /* ─────────────────────────────────────────────────────
       7. INITIALISE
       ───────────────────────────────────────────────────── */
    async function init() {
      try {
        const cred = await signInAnonymously(auth);
        ID = cred.user.uid;
      } catch (e) {
        $("#main").innerHTML = `<div class="hero empty"><h2>🔒 Sign-in failed</h2><p>${esc(why(e))}</p></div>`;
        return;
      }

      // Profile (just for display purposes)
      try {
        await setDoc(doc(db, "users", ID), {
          name: "User-" + ID.slice(0, 6).toUpperCase()
        }, { merge: true });
      } catch (e) {}

      // User helper (kept for compatibility)
      U = {
        id: async () => ID,
        profiles: async (ids) => {
          const out = {};
          await Promise.all(ids.map(async uid => {
            try {
              const s = await getDoc(doc(db, "users", uid));
              out[uid] = s.exists() ? s.data() : { name: "User-" + uid.slice(0, 6).toUpperCase() };
            } catch (e) {
              out[uid] = { name: "User-" + uid.slice(0, 6).toUpperCase() };
            }
          }));
          return out;
        }
      };

      // If a room name was saved before, auto-load it
      const savedSlug = localStorage.getItem("roomSlug");
      const savedName = localStorage.getItem("roomName");
      if (savedSlug && savedName) {
        await loadRoom(savedSlug, savedName);
      } else {
        render();
      }
    }

    /* ─────────────────────────────────────────────────────
       8. LOAD / SWITCH ROOM
       ───────────────────────────────────────────────────── */
    async function loadRoom(slug, displayName) {
      // Detach previous listener
      if (roomUnsub) { roomUnsub(); roomUnsub = null; }

      R = { id: slug, name: displayName };

      // Make sure the room doc exists (harmless if already there)
      try {
        const ref = doc(db, "rooms", slug);
        const s = await getDoc(ref);
        if (!s.exists()) {
          await setDoc(ref, {
            name: displayName,
            created: Date.now(),
            createdBy: ID
          });
        }
      } catch (e) {
        // Not fatal
      }

      // Reset local state, then load per-device prefs
      D = fresh();
      try {
        D.open = JSON.parse(localStorage.getItem("open_" + slug) || "{}");
        D.pend = localStorage.getItem("pend_" + slug) === "1";
      } catch (e) {}

      // Live listener for shared room data
      roomUnsub = onSnapshot(doc(db, "roomdata", slug), snap => {
        if (snap.exists()) {
          const data = snap.data() || {};
          D.ck = data.ck || {};
          D.nt = data.nt || {};
          D.fl = data.fl || {};
        } else {
          D.ck = {}; D.nt = {}; D.fl = {};
        }
        // Re-render everything so both devices stay in sync
        render();
      }, (err) => {
        toast("Room listener failed: " + why(err));
      });

      // Update header chip
      updateRoomChip();
    }

    function updateRoomChip() {
      $("#rnow").textContent = R ? R.name : "No room";
    }

    /* ─────────────────────────────────────────────────────
       9. PROMPT FOR ROOM NAME
       ───────────────────────────────────────────────────── */
    async function promptRoom() {
      const curName = R ? R.name : (localStorage.getItem("roomName") || "");
      const n = prompt(
        "📝 Enter room name.\n\n" +
        "Type the SAME name on every device (PC, mobile, tablet) to open the same room.\n\n" +
        "Example: 'Study Group'",
        curName
      );
      if (n === null) return;                    // user cancelled
      const trimmed = n.trim().slice(0, 60);
      if (!trimmed) { toast("Name can't be empty"); return; }

      const slug = slugify(trimmed);
      if (!slug) { toast("Use letters or numbers"); return; }

      localStorage.setItem("roomName", trimmed);
      localStorage.setItem("roomSlug", slug);

      await loadRoom(slug, trimmed);
      toast("Room: " + trimmed);
    }

    /* ─────────────────────────────────────────────────────
       10. RENDER
       ───────────────────────────────────────────────────── */
    function tabs() {
      $("#tabs").innerHTML = S.map((s, i) => {
        const p = prog(i);
        return `<button class="tab ${i === cur ? "on" : ""}" data-i="${i}" style="--c1:${COL[i][0]};--c2:${COL[i][1]}"><b>${s.c}</b><small>${p.p}% · ${p.d}/${p.t}</small><div class="bar"><i style="width:${p.p}%;--c1:${COL[i][0]};--c2:${COL[i][1]}"></i></div></button>`;
      }).join("");
    }

    function page() {
      if (!R) {
        $("#main").innerHTML = `<div class="hero empty">
          <h2>🏠 Set a room name</h2>
          <p>Tap the <b>logo</b> at the top, or use the button below.</p>
          <p style="opacity:.85">Use the same name on every device — PC, mobile, tablet — to open the same live-synced room.</p>
          <div class="row" style="justify-content:center">
            <button class="b" id="setRoomBtn">📝 Set room name</button>
          </div>
        </div>`;
        return;
      }

      const i = cur, s = S[i], p = prog(i);

      let h = `<div class="hero"><h2>${s.c} — ${s.n}</h2><p>Room: <b>${esc(R.name)}</b> · changes sync live across devices</p>
        <div class="row" style="margin-top:0"><span class="big" id="pp">${p.p}%</span><span id="pc">${p.d} of ${p.t} questions done</span></div>
        <div class="bar" style="margin-top:8px"><i id="pb" style="width:${p.p}%"></i></div>
        <div class="row"><label><input type="checkbox" id="pend" ${D.pend ? "checked" : ""}> Revision mode: only pending</label><button class="b" id="rs">Reset subject</button></div></div>`;

      s.u.forEach((u, j) => {
        const qs = u.q.map((q, k) => ({ ...parse(q), k }));
        const ud = qs.filter(x => D.ck[qid(i, j, x.k)]).length;

        h += `<details ${D.open[i + "." + j] !== false ? "open" : ""} data-u="${i}.${j}"><summary>Unit ${j + 1} — ${u.t}<span id="uc${j}">${ud}/${qs.length}</span></summary><div class="in"><div class="syl"><b>Syllabus:</b> ${u.s}</div>`;

        qs.forEach(x => {
          const id = qid(i, j, x.k), c = !!D.ck[id];
          if (D.pend && c) return;
          const fl = D.fl[id] || [], has = fl.length || D.nt[id];

          h += `<div class="qw"><label class="q ${c ? "done" : ""} ${x.star ? "star" : ""} ${x.two ? "two" : ""}"><input type="checkbox" data-q="${id}" data-j="${j}" ${c ? "checked" : ""}><span>${x.two ? "<b>2-mark:</b> " : ""}${x.txt}</span></label><button class="b clip ${has ? "has" : ""}" data-qn="${id}" title="Notes & files">📎${fl.length ? fl.length : ""}</button></div>`;

          if (qo[id]) {
            h += `<div class="qn"><textarea data-n="${id}" placeholder="Hints / notes for this question…">${esc(D.nt[id] || "")}</textarea>
              ${fl.map((f, n) => `<div class="f">📄<span>${esc(f.name)}</span><button class="b" data-fd="${id}|${n}">⬇</button><button class="b" data-fx="${id}|${n}">✕</button></div>`).join("")}
              <div class="row"><button class="b" data-at="${id}">⬆ Attach file</button><button class="b" data-dl="${id}">⬇ Download note</button><small style="color:var(--mut)">txt, md, pdf, docx, pptx</small></div></div>`;
          }
        });

        h += "</div></details>";
      });

      $("#main").innerHTML = h;
    }

    function render() {
      updateRoomChip();
      if (!R) { $("#tabs").innerHTML = ""; page(); return; }
      const c = COL[cur];
      document.documentElement.style.setProperty("--sc", c[0]);
      document.documentElement.style.setProperty("--sc2", c[1]);
      tabs();
      page();
    }

    /* ─────────────────────────────────────────────────────
       11. EVENT HANDLERS — header
       ───────────────────────────────────────────────────── */
    $("#tabs").onclick = e => {
      const t = e.target.closest(".tab");
      if (t) { cur = +t.dataset.i; render(); scrollTo(0, 0); }
    };

    // Logo click → prompt for room name
    $("#logoBtn").onclick = promptRoom;

    // Room chip click → same prompt
    $("#roomChip").onclick = promptRoom;

    /* ─────────────────────────────────────────────────────
       12. EVENT HANDLERS — main panel
       ───────────────────────────────────────────────────── */
    $("#main").addEventListener("change", e => {
      const t = e.target;

      if (t.id === "pend") {
        D.pend = t.checked;
        persist();
        page();
        return;
      }

      if (t.dataset.q) {
        t.checked ? D.ck[t.dataset.q] = 1 : delete D.ck[t.dataset.q];
        persist();

        t.closest("label").classList.toggle("done", t.checked);

        const p = prog(cur);
        if ($("#pp")) $("#pp").textContent = p.p + "%";
        if ($("#pc")) $("#pc").textContent = `${p.d} of ${p.t} questions done`;
        if ($("#pb")) $("#pb").style.width = p.p + "%";

        const j = +t.dataset.j;
        let n = 0;
        S[cur].u[j].q.forEach((q, k) => { if (D.ck[qid(cur, j, k)]) n++; });
        const uc = $("#uc" + j);
        if (uc) uc.textContent = `${n}/${S[cur].u[j].q.length}`;
        tabs();
      }
    });

    $("#main").addEventListener("input", e => {
      if (e.target.dataset.n) {
        D.nt[e.target.dataset.n] = e.target.value;
        persist();
      }
    });

    $("#main").addEventListener("toggle", e => {
      if (e.target.dataset && e.target.dataset.u) {
        D.open[e.target.dataset.u] = e.target.open;
        persist();
      }
    }, true);

    $("#main").addEventListener("click", async e => {
      const b = e.target.closest("button");
      if (!b) return;

      if (b.id === "setRoomBtn") return promptRoom();

      if (b.id === "rs") {
        if (confirm("Clear all ticks for " + S[cur].c + "?")) {
          S[cur].u.forEach((u, j) => u.q.forEach((q, k) => delete D.ck[qid(cur, j, k)]));
          persist();
          render();
        }
        return;
      }

      if (b.dataset.qn) { qo[b.dataset.qn] = !qo[b.dataset.qn]; page(); return; }

      if (b.dataset.at) {
        const q = b.dataset.at;
        const f = document.createElement("input");
        f.type = "file";
        f.accept = ".txt,.md,.pdf,.docx,.pptx";
        f.onchange = () => f.files[0] && attach(q, f.files[0]);
        f.click();
        return;
      }

      if (b.dataset.dl) {
        const q = b.dataset.dl;
        dl(`note-${q.replace(/\./g, "-")}.txt`, D.nt[q] || "");
        return;
      }

      if (b.dataset.fd) {
        const [q, n] = b.dataset.fd.split("|"), f = D.fl[q][n];
        try { dl(f.name, await (await fetch(f.url)).blob()); }
        catch (er) { toast("Couldn't fetch file"); }
        return;
      }

      if (b.dataset.fx) {
        const [q, n] = b.dataset.fx.split("|");
        if (confirm("Remove this file from the question?")) {
          D.fl[q].splice(n, 1);
          persist();
          page();
        }
      }
    });

    /* ─────────────────────────────────────────────────────
       13. DOWNLOAD & FILE ATTACH HELPERS
       ───────────────────────────────────────────────────── */
    function dl(name, data) {
      try {
        const blob = data instanceof Blob ? data : new Blob([String(data)], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        toast("Saved ✓");
      } catch (e) { toast("Couldn't save"); }
    }

    async function attach(q, f) {
      const ext = f.name.split(".").pop().toLowerCase();
      let blob, name = f.name;

      try {
        if (ext === "docx" || ext === "pptx") {
          if (!window.JSZip) { toast("Reader not loaded, try again"); return; }
          const z = await JSZip.loadAsync(f);
          const ns = Object.keys(z.files)
            .filter(n => ext === "docx" ? n === "word/document.xml" : /^ppt\/slides\/slide\d+\.xml$/.test(n))
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
          const out = [];
          for (const n of ns) {
            const x = await z.file(n).async("string");
            out.push(x.replace(/<\/(w:p|a:p)>/g, "\n")
              .replace(/<[^>]+>/g, "")
              .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"));
          }
          blob = new Blob([out.join("\n\n")], { type: "text/plain" });
          name += ".txt";
        }
        else if (ext === "pdf") blob = new Blob([f], { type: "application/pdf" });
        else if (ext === "txt") blob = new Blob([f], { type: "text/plain" });
        else if (ext === "md")  blob = new Blob([f], { type: "text/markdown" });
        else { toast("Use txt, md, pdf, docx or pptx (convert old .doc/.ppt first)"); return; }

        toast("Uploading…");
        const path = "files/" + R.id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2) + "-" + name;
        const r = await uploadBytes(sRef(storage, path), blob);
        const url = await getDownloadURL(r.ref);
        (D.fl[q] = D.fl[q] || []).push({ url, name });
        persist();
        page();
        toast(ext === "docx" || ext === "pptx" ? "Attached (text extracted)" : "Attached ✓");
      } catch (e) {
        toast("Upload failed" + (e && e.code ? ": " + e.code : ""));
      }
    }

    /* ─────────────────────────────────────────────────────
       14. START
       ───────────────────────────────────────────────────── */
    init();
  </script>
</body>
</html>
