<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>7th semester Study Hub</title>
    <link rel="icon" href="logo.png" />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --bg: #f3f0ff;
        --card: #fff;
        --ink: #1d2330;
        --mut: #667085;
        --line: #e4e0f5;
        --sc: #7c3aed;
        --sc2: #ec4899;
        --ok: #16a34a;
        --hi: #fff1c2;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #14122a;
          --card: #1d1b36;
          --ink: #ecebff;
          --mut: #a5a3c9;
          --line: #2f2c55;
          --hi: #4a3d12;
        }
      }
      :root[data-theme="dark"] {
        --bg: #14122a;
        --card: #1d1b36;
        --ink: #ecebff;
        --mut: #a5a3c9;
        --line: #2f2c55;
        --hi: #4a3d12;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        background: var(--card);
        border-bottom: 3px solid var(--sc);
        z-index: 5;
      }
      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 0 14px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 10px 0 6px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        background: linear-gradient(90deg, var(--sc), var(--sc2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .rb {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      select,
      input[type="text"],
      #ms {
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 8px;
        padding: 6px 8px;
        font: inherit;
        font-size: 13px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 10px;
      }
      .tab {
        flex: 1 0 auto;
        min-width: 118px;
        text-align: left;
        border: 2px solid transparent;
        background: var(--bg);
        color: var(--ink);
        border-radius: 12px;
        padding: 7px 10px;
        cursor: pointer;
        font: inherit;
      }
      .tab b {
        display: block;
        font-size: 13px;
      }
      .tab small {
        color: var(--mut);
        font-size: 11px;
      }
      .tab.on {
        background: linear-gradient(135deg, var(--c1), var(--c2));
        color: #fff;
      }
      .tab.on small {
        color: #ffffffcc;
      }
      .bar {
        height: 7px;
        background: var(--line);
        border-radius: 9px;
        overflow: hidden;
        margin-top: 4px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--c1, var(--sc)), var(--c2, var(--sc2)));
        width: 0;
        transition: width 0.3s;
      }
      .tab.on .bar {
        background: #ffffff55;
      }
      .tab.on .bar i {
        background: #fff;
      }
      .b {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }
      .b:hover {
        border-color: var(--sc);
      }
      .hero {
        background: linear-gradient(135deg, var(--sc), var(--sc2));
        color: #fff;
        border-radius: 16px;
        padding: 16px;
        margin: 14px 0;
      }
      .hero h2 {
        margin: 0 0 2px;
        font-size: 20px;
      }
      .hero p {
        margin: 0 0 10px;
        opacity: 0.85;
        font-size: 14px;
      }
      .hero .bar {
        height: 14px;
        background: #ffffff44;
      }
      .hero .bar i {
        background: #fff;
      }
      .hero .b {
        background: #ffffff26;
        color: #fff;
        border-color: #ffffff66;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .big {
        font-size: 28px;
        font-weight: 800;
      }
      .mem {
        background: var(--card);
        color: var(--ink);
        border: 2px solid var(--sc);
      }
      .mem .b {
        background: var(--card);
        color: var(--ink);
      }
      .mrow {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 6px 0;
        border-top: 1px solid var(--line);
      }
      .mrow small {
        color: var(--mut);
        flex: 1;
      }
      details {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 6px solid var(--sc);
        border-radius: 12px;
        margin: 10px 0;
        overflow: hidden;
      }
      summary {
        cursor: pointer;
        padding: 12px 14px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }
      summary span {
        font-size: 12px;
        color: #fff;
        background: var(--sc);
        border-radius: 99px;
        padding: 1px 9px;
        white-space: nowrap;
      }
      .in {
        padding: 0 14px 14px;
      }
      .syl {
        font-size: 14px;
        color: var(--mut);
        background: var(--bg);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 8px;
      }
      .qw {
        display: flex;
        align-items: flex-start;
        border-top: 1px solid var(--line);
      }
      label.q {
        flex: 1;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 9px 6px;
        cursor: pointer;
      }
      label.q input {
        width: 20px;
        height: 20px;
        margin-top: 2px;
        accent-color: var(--ok);
        flex: none;
      }
      label.q.done span {
        text-decoration: line-through;
        color: var(--mut);
      }
      label.q.star span:before {
        content: "★ ";
        color: #f59e0b;
      }
      label.q.two {
        background: var(--hi);
        border-radius: 6px;
      }
      .clip {
        margin: 6px 0 0 4px;
        flex: none;
      }
      .clip.has {
        border-color: var(--sc);
        color: var(--sc);
      }
      .qn {
        background: var(--bg);
        border-radius: 10px;
        padding: 10px;
        margin: 0 0 8px;
      }
      textarea {
        width: 100%;
        min-height: 80px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--ink);
        font: 14px/1.5 inherit;
        padding: 8px;
        resize: vertical;
      }
      .f {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        padding: 3px 0;
        word-break: break-all;
      }
      .f span {
        flex: 1;
      }
      .file-list {
        background: var(--bg);
        border-radius: 10px;
        padding: 8px 10px;
        margin: 6px 0 8px;
        border-left: 4px solid var(--sc);
      }
      .file-list .f {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        padding: 4px 0;
        word-break: break-all;
      }
      .file-list .f span {
        flex: 1;
        color: var(--ink);
      }
      .empty {
        text-align: center;
        padding: 40px 10px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: #111;
        color: #fff;
        border-radius: 9px;
        padding: 8px 14px;
        font-size: 13px;
        display: none;
        z-index: 9;
      }
      .b {
        text-decoration: none;
        display: inline-block;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lg {
        font-size: 22px;
      }
      input[type="password"] {
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 8px;
        padding: 8px;
        font: inherit;
        width: min(320px, 100%);
      }
      #gn {
        width: min(320px, 100%);
        padding: 8px;
      }
      .f a {
        flex: none;
      }
      #chip b {
        color: var(--sc);
      }
      @media (max-width: 520px) {
        textarea,
        input,
        select {
          font-size: 16px !important;
        }
      }
    </style>
  </head>

      function b64ToBlob(b64, mime) {
        const bin = atob(b64);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return new Blob([arr], { type: mime });

      function fileToB64(file) {
        return new Promise((resolve, reject) => {
          const r = new FileReader();
          r.onload = () => {
            const s = r.result;
            const i = s.indexOf(",");
            resolve(s.slice(i + 1));
          };
          r.onerror = reject;
          r.readAsDataURL(file);
        });
      }

      async function attach(q, f) {
        if (!R) return;
        const room = R.id;
        if (f.size > 500 * 1024) {
          toast("File too big (max 500 KB, since we save inside Firestore)");
          return;
        }
        const ext = f.name.split(".").pop().toLowerCase();
        let blob,
          name = f.name,
          mime = f.type || "application/octet-stream";
        try {
          if (ext === "docx" || ext === "pptx") {
            if (!window.JSZip) {
              toast("Reader not loaded, try again");
              return;
            }
            const z = await JSZip.loadAsync(f),
              ns = Object.keys(z.files)
                .filter((n) =>
                  ext === "docx"
                    ? n === "word/document.xml"
                    : /^ppt\/slides\/slide\d+\.xml$/.test(n),
                )
                .sort((a, b) => a.localeCompare(b, undefined, { numeric: true })),
              out = [];
            for (const n of ns) {
              const x = await z.file(n).async("string");
              out.push(
                x
                  .replace(/<\/(w:p|a:p)>/g, "\n")
                  .replace(/<(w:br|w:tab)[^>]*\/>/g, " ")
                  .replace(/<[^>]+>/g, "")
                  .replace(/&lt;/g, "<")
                  .replace(/&gt;/g, ">")
                  .replace(/&quot;/g, '"')
                  .replace(/&apos;/g, "'")
                  .replace(/&amp;/g, "&"),
              );
            }
            blob = new Blob([out.join("\n\n")], { type: "text/plain" });
            name += ".txt";
            mime = "text/plain";
          } else if (ext === "pdf") {
            blob = new Blob([f], { type: "application/pdf" });
            mime = "application/pdf";
          } else if (ext === "txt") {
            blob = new Blob([f], { type: "text/plain" });
            mime = "text/plain";
          } else if (ext === "md") {
            blob = new Blob([f], { type: "text/markdown" });
            mime = "text/markdown";
          } else {
            toast("Use txt, md, pdf, docx or pptx");
            return;
          }
          if (blob.size > 500 * 1024) {
            toast("File too big after processing (max 500 KB)");
            return;
          }
          toast("Saving…");
          const b64 = await fileToB64(blob);
          if (!R || R.id !== room) return;
          D.fl[q] = [...(D.fl[q] || []), { name, type: mime, data: b64 }];
          mark("fl", q);
          qo[q] = true;
          page();
          toast("Attached ✓ (saved in DB)");
        } catch (e) {
          toast("Attach failed:" + why(e));
        }
      }

      })();
    </script>
