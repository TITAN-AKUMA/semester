        --hi: #fff1c2;

          --card: #1d1b36;
          --ink: #ecebff;
          --mut: #a5a3c9;
          --line: #2f2c55;
          --hi: #4a3d12;

        --card: #1d1b36;
        --ink: #ecebff;
        --mut: #a5a3c9;
        --line: #2f2c55;
        --hi: #4a3d12;

      html {

      }
      * {
        box-sizing: border-box;
      }

        color: var(--ink);

          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        background: var(--card);
        border-bottom: 3px solid var(--sc);
        z-index: 5;
      }
      .wrap {
        max-width: 880px;
        margin: 0 auto;
        padding: 0 14px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 10px 0 6px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        background: linear-gradient(90deg, var(--sc), var(--sc2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .rb {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      select,
      input[type="text"],
      #ms {
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 8px;
        padding: 6px 8px;
        font: inherit;
        font-size: 13px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 10px;
      }
      .tab {
        flex: 1 0 auto;
        min-width: 118px;
        text-align: left;
        border: 2px solid transparent;
        background: var(--bg);
        color: var(--ink);
        border-radius: 12px;
        padding: 7px 10px;
        cursor: pointer;
        font: inherit;
      }
      .tab b {
        display: block;
        font-size: 13px;
      }
      .tab small {
        color: var(--mut);
        font-size: 11px;
      }
      .tab.on {
        background: linear-gradient(135deg, var(--c1), var(--c2));
        color: #fff;
      }
      .tab.on small {
        color: #ffffffcc;
      }
      .bar {
        height: 7px;
        background: var(--line);
        border-radius: 9px;
        overflow: hidden;
        margin-top: 4px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--c1, var(--sc)), var(--c2, var(--sc2)));
        width: 0;
        transition: width 0.3s;
      }
      .tab.on .bar {
        background: #ffffff55;
      }
      .tab.on .bar i {
        background: #fff;
      }
      .b {
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--ink);
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
      }
      .b:hover {
        border-color: var(--sc);
      }
      .hero {
        background: linear-gradient(135deg, var(--sc), var(--sc2));
        color: #fff;
        border-radius: 16px;
        padding: 16px;
        margin: 14px 0;
      }
      .hero h2 {
        margin: 0 0 2px;
        font-size: 20px;
      }
      .hero p {
        margin: 0 0 10px;
        opacity: 0.85;
        font-size: 14px;
      }
      .hero .bar {
        height: 14px;
        background: #ffffff44;
      }
      .hero .bar i {
        background: #fff;
      }
      .hero .b {
        background: #ffffff26;
        color: #fff;
        border-color: #ffffff66;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .big {
        font-size: 28px;
        font-weight: 800;
      }
      .mem {
        background: var(--card);
        color: var(--ink);
        border: 2px solid var(--sc);
      }
      .mem .b {
        background: var(--card);
        color: var(--ink);
      }

        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        padding: 6px 0;
        border-top: 1px solid var(--line);
      }
      .mrow small {
        color: var(--mut);
        flex: 1;
      }
      details {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 6px solid var(--sc);
        border-radius: 12px;
        margin: 10px 0;
        overflow: hidden;
      }

        cursor: pointer;
        padding: 12px 14px;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: center;
      }

        font-size: 12px;
        color: #fff;
        background: var(--sc);
        border-radius: 99px;
        padding: 1px 9px;
        white-space: nowrap;
      }
      .in {
        padding: 0 14px 14px;
      }
      .syl {
        font-size: 14px;
        color: var(--mut);
        background: var(--bg);
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 8px;
      }
      .qw {
        display: flex;
        align-items: flex-start;
        border-top: 1px solid var(--line);
      }
      label.q {
        flex: 1;
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 9px 6px;
        cursor: pointer;
      }
      label.q input {
        width: 20px;
        height: 20px;
        margin-top: 2px;
        accent-color: var(--ok);
        flex: none;
      }
      label.q.done span {
        text-decoration: line-through;
        color: var(--mut);
      }
      label.q.star span:before {
        content: "★ ";
        color: #f59e0b;
      }
      label.q.two {
        background: var(--hi);
        border-radius: 6px;
      }
      .clip {
        margin: 6px 0 0 4px;
        flex: none;
      }
      .clip.has {
        border-color: var(--sc);
        color: var(--sc);
      }
      .qn {
        background: var(--bg);
        border-radius: 10px;
        padding: 10px;
        margin: 0 0 8px;
      }
      textarea {
        width: 100%;
        min-height: 80px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--ink);
        font: 14px/1.5 inherit;
        padding: 8px;
        resize: vertical;
      }
      .f {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 13px;
        padding: 3px 0;
        word-break: break-all;
      }
      .f span {
        flex: 1;
      }
      .empty {
        text-align: center;
        padding: 40px 10px;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: #111;
        color: #fff;
        border-radius: 9px;
        padding: 8px 14px;
        font-size: 13px;
        display: none;
        z-index: 9;
      }
      .b {
        text-decoration: none;
        display: inline-block;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .lg {
        font-size: 22px;
      }
      input[type="password"] {
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 8px;
        padding: 8px;
        font: inherit;
        width: min(320px, 100%);
      }
      #gn {
        width: min(320px, 100%);
        padding: 8px;
      }
      .f a {
        flex: none;
      }
      #chip b {
        color: var(--sc);
      }
      @media (max-width: 520px) {
        textarea,
        input,
        select {
          font-size: 16px !important;
        }
      }
    </style>
  </head>

          sent = freshP();
        let any = false;
        for (const s of SECS)
          for (const id in P[s]) {
            sent[s][id] = P[s][id];
            (patch[s] = patch[s] || {})[id] = D[s][id] !== undefined ? D[s][id] : deleteField();
            any = true;
          }
        if (!any) return;
        patch.updated = Date.now();
        try {
          await setDoc(doc(db, "roomdata", R.id), patch, { merge: true });
          for (const s of SECS)
            for (const id in sent[s]) if (P[s][id] === sent[s][id]) delete P[s][id];
        } catch (e) {
          toast("Couldn't save (will retry):" + why(e));
          timer = setTimeout(flush, 5000);
        }
      }
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) flush();
      });
      addEventListener("pagehide", flush);

      /* ---- remote data ---- */
      const same = (x, y) =>
        Array.isArray(x)
          ? Array.isArray(y) &&
            x.length === y.length &&
            x.every((f, i) => f.url === y[i].url && f.name === y[i].name)
          : x === y;
      const eq = (a, b) => {
        const k = Object.keys(a);
        return k.length === Object.keys(b).length && k.every((x) => x in b && same(a[x], b[x]));
      };
      function merge(data) {
        // remote -> D, but never overwrite keys with unsent local edits
        const ch = {};
        for (const s of SECS) {
          const r = { ...(data[s] || {}) };
          for (const id in P[s]) {
            if (D[s][id] !== undefined) r[id] = D[s][id];
            else delete r[id];
          }
          if (!eq(D[s], r)) {
            ch[s] = 1;
            D[s] = r;
          }
        }
        return ch;
      }
      function applyRemote(data) {
        const ch = merge(data);
        if (!ch.ck && !ch.nt && !ch.fl) return;
        if (ch.ck)
          document.querySelectorAll("input[data-q]").forEach((cb) => {
            const on = !!D.ck[cb.dataset.q];
            if (cb.checked !== on) {
              cb.checked = on;
              cb.closest("label").classList.toggle("done", on);
            }
          });
        if (ch.nt)
          document.querySelectorAll("textarea[data-n]").forEach((t) => {
            if (t === document.activeElement) return;
            const v = D.nt[t.dataset.n] || "";
            if (t.value !== v) t.value = v;
          });
        if (ch.nt || ch.fl)
          document.querySelectorAll(".qw").forEach((r) => {
            const id = r.querySelector("input[data-q]").dataset.q,
              n = (D.fl[id] || []).length,
              b = r.querySelector(".clip");
            b.textContent = "📎" + (n || "");
            b.classList.toggle("has", n > 0 || !!D.nt[id]);
          });
        updateProgress();
        tabs();
        if (ch.fl || (UI.pend && ch.ck)) {
          if (typing()) deferred = true;
          else render();
        }
      }
      $("#main").addEventListener("focusout", () =>
        setTimeout(() => {
          if (deferred && !typing()) {
            deferred = false;
            render();
          }
        }, 400),
      );
      function updateProgress() {
        const p = prog(cur);
        if ($("#pp")) {
          $("#pp").textContent = p.p + "%";
          $("#pc").textContent = `${p.d} of ${p.t} questions done`;
          $("#pb").style.width = p.p + "%";
        }
        S[cur].u.forEach((u, j) => {
          const n = u.q.filter((q, k) => D.ck[qid(cur, j, k)]).length,
            e = $("#uc" + j);
          if (e) e.textContent = `${n}/${u.q.length}`;
        });
      }

      /* ---- rooms (room key = SHA-256 of name + passcode, so the name alone can't open a room) ---- */
      async function openRoom(key, name) {
        const my = ++tok;
        await flush();
        if (unsub) {
          unsub();
          unsub = null;
        }
        R = { id: key, name };
        D = fresh();
        P = freshP();
        loaded = false;
        deferred = false;
        qo = {};
        try {
          UI.open = JSON.parse(ls.get("open_" + key) || "{}");
        } catch (e) {
          UI.open = {};
        }
        UI.pend = ls.get("pend_" + key) === "1";
        render();
        unsub = onSnapshot(
          doc(db, "roomdata", key),
          (snap) => {
            if (my !== tok || snap.metadata.hasPendingWrites) return;
            const data = snap.exists() ? snap.data() : {};
            if (!loaded) {
              loaded = true;
              merge(data);
              render();
            } else applyRemote(data);
          },
          (err) => {
            if (my !== tok) return;
            loaded = true;
            render();
            toast("Sync error:" + why(err));
          },
        );
      }
      async function enter(name, pass) {
        name = name.trim().slice(0, 60);
        if (!name || !pass) {
          toast("Enter a room name and a passcode");
          return;
        }
        if (!(window.crypto && crypto.subtle)) {
          toast("Open this page over https");
          return;
        }
        const key = await hash(name.toLowerCase() + "\n" + pass);
        ls.set("room", JSON.stringify({ key, name }));
        await openRoom(key, name);
      }
      async function leave() {
        await flush();
        if (unsub) {
          unsub();
          unsub = null;
        }
        tok++;
        R = null;
        render();
      }

      /* ---- render ---- */
      function tabs() {
        $("#tabs").innerHTML = S.map((s, i) => {
          const p = prog(i);
          return `<button class="tab ${i === cur ? "on" : ""}" data-i="${i}" style="--c1:${COL[i][0]};--c2:${COL[i][1]}"><b>${s.c}</b><small>${p.p}% · ${p.d}/${p.t}</small><div class="bar"><i style="width:${p.p}%;--c1:${COL[i][0]};--c2:${COL[i][1]}"></i></div></button>`;
        }).join("");
      }
      function page() {
        if (!R) {
          let last = {};
          try {
            last = JSON.parse(ls.get("room") || "{}");
          } catch (e) {}
          $("#main").innerHTML =
            `<div class="hero empty"><h2>🏠 Enter your room</h2><p>Use the same room name and passcode on every device. Anyone with both can open the room, so keep the passcode private.</p>
  <div class="row" style="justify-content:center"><input type="text" id="gn" placeholder="Room name" maxlength="60" value="${esc(last.name || "")}"></div>
  <div class="row" style="justify-content:center"><input type="password" id="gp" placeholder="Passcode" maxlength="60" autocomplete="off"></div>
  <div class="row" style="justify-content:center"><button class="b" id="go">Enter room</button></div></div>`;
          return;
        }
        if (!loaded) {
          $("#main").innerHTML = `<div class="hero empty"><h2>Loading room…</h2></div>`;
          return;
        }
        const i = cur,
          s = S[i],
          p = prog(i);
        let h = `<div class="hero"><h2>${s.c} — ${s.n}</h2><p>Room: <b>${esc(R.name)}</b> · syncs live across devices</p>
 <div class="row" style="margin-top:0"><span class="big" id="pp">${p.p}%</span><span id="pc">${p.d} of ${p.t} questions done</span></div>
 <div class="bar" style="margin-top:8px"><i id="pb" style="width:${p.p}%"></i></div>
 <div class="row"><label><input type="checkbox" id="pend" ${UI.pend ? "checked" : ""}> Revision mode: only pending</label><button class="b" id="rs">Reset subject</button></div></div>`;
        s.u.forEach((u, j) => {
          const qs = u.q.map((q, k) => ({ ...parse(q), k })),
            ud = qs.filter((x) => D.ck[qid(i, j, x.k)]).length;
          h += `<details ${UI.open[i + "_" + j] !== false ? "open" : ""} data-u="${i}_${j}"><summary>Unit ${j + 1} — ${u.t}<span id="uc${j}">${ud}/${qs.length}</span></summary><div class="in"><div class="syl"><b>Syllabus:</b> ${u.s}</div>`;
          qs.forEach((x) => {
            const id = qid(i, j, x.k),
              c = !!D.ck[id];
            if (UI.pend && c) return;
            const fl = D.fl[id] || [],
              has = fl.length || D.nt[id];
            h += `<div class="qw"><label class="q ${c ? "done" : ""} ${x.star ? "star" : ""} ${x.two ? "two" : ""}"><input type="checkbox" data-q="${id}" ${c ? "checked" : ""}><span>${x.two ? "<b>2-mark:</b> " : ""}${x.txt}</span></label><button class="b clip ${has ? "has" : ""}" data-qn="${id}" title="Notes & files">📎${fl.length || ""}</button></div>`;
            if (qo[id])
              h += `<div class="qn"><textarea data-n="${id}" maxlength="6000" placeholder="Hints / notes for this question…">${esc(D.nt[id] || "")}</textarea>
   ${fl.map((f, n) => `<div class="f">📄<span>${esc(f.name)}</span>${safeUrl(f.url) ? `<a class="b" href="${esc(f.url)}" target="_blank" rel="noopener">Open</a>` : ""}<button class="b" data-fx="${id}|${n}">✕</button></div>`).join("")}
   <div class="row"><button class="b" data-at="${id}">⬆ Attach file</button><button class="b" data-dl="${id}">⬇ Download note</button><small style="color:var(--mut)">txt, md, pdf, docx, pptx · max 10 MB</small></div></div>`;
          });
          h += "</div></details>";
        });
        $("#main").innerHTML = h;
      }
      function render() {
        $("#rnow").textContent = R ? R.name : "No room";
        if (!R) {
          $("#tabs").innerHTML = "";
          page();
          return;
        }
        document.documentElement.style.setProperty("--sc", COL[cur][0]);
        document.documentElement.style.setProperty("--sc2", COL[cur][1]);
        tabs();
        page();
      }

      /* ---- events ---- */
      $("#chip").onclick = leave;
      $("#tabs").onclick = (e) => {
        const t = e.target.closest(".tab");
        if (t) {
          cur = +t.dataset.i;
          render();
          scrollTo(0, 0);
        }
      };
      $("#main").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && (e.target.id === "gn" || e.target.id === "gp")) $("#go").click();
      });
      $("#main").addEventListener("change", (e) => {
        const t = e.target;
        if (t.id === "pend") {
          UI.pend = t.checked;
          ls.set("pend_" + R.id, t.checked ? "1" : "0");
          page();
          return;
        }
        if (t.dataset.q) {
          t.checked ? (D.ck[t.dataset.q] = 1) : delete D.ck[t.dataset.q];
          mark("ck", t.dataset.q);
          if (UI.pend) {
            render();
            return;
          }
          t.closest("label").classList.toggle("done", t.checked);
          updateProgress();
          tabs();
        }
      });
      $("#main").addEventListener("input", (e) => {
        const id = e.target.dataset.n;
        if (!id) return;
        e.target.value ? (D.nt[id] = e.target.value) : delete D.nt[id];
        mark("nt", id);
      });
      $("#main").addEventListener(
        "toggle",
        (e) => {
          const u = e.target.dataset && e.target.dataset.u;
          if (u && R) {
            UI.open[u] = e.target.open;
            ls.set("open_" + R.id, JSON.stringify(UI.open));
          }
        },
        true,
      );
      $("#main").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.id === "go") return enter($("#gn").value, $("#gp").value);
        if (b.id === "rs") {
          if (confirm("Clear all ticks for " + S[cur].c + "?")) {
            S[cur].u.forEach((u, j) =>
              u.q.forEach((q, k) => {
                const id = qid(cur, j, k);
                if (D.ck[id]) {
                  delete D.ck[id];
                  mark("ck", id);
                }
              }),
            );
            render();
          }
          return;
        }
        if (b.dataset.qn) {
          qo[b.dataset.qn] = !qo[b.dataset.qn];
          page();
          return;
        }
        if (b.dataset.at) {
          const q = b.dataset.at,
            f = document.createElement("input");
          f.type = "file";
          f.accept = ".txt,.md,.pdf,.docx,.pptx";
          f.onchange = () => f.files[0] && attach(q, f.files[0]);
          f.click();
          return;
        }
        if (b.dataset.dl) {
          const q = b.dataset.dl,
            a = document.createElement("a");
          a.href = URL.createObjectURL(new Blob([D.nt[q] || ""], { type: "text/plain" }));
          a.download = "note-" + q + ".txt";
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 5000);
          return;
        }
        if (b.dataset.fx) {
          const [q, n] = b.dataset.fx.split("|");
          if (confirm("Remove this file from the question?")) {
            D.fl[q] = D.fl[q].filter((_, i) => i !== +n);
            if (!D.fl[q].length) delete D.fl[q];
            mark("fl", q);
            page();
          }
        }
      });

      /* ---- file attach ---- */
      async function attach(q, f) {
        if (!R) return;
        const room = R.id;
        if (f.size > 10 * 1024 * 1024) {
          toast("File too big (max 10 MB)");
          return;
        }
        const ext = f.name.split(".").pop().toLowerCase();
        let blob,
          name = f.name;
        try {
          if (ext === "docx" || ext === "pptx") {
            if (!window.JSZip) {
              toast("Reader not loaded, try again");
              return;
            }
            const z = await JSZip.loadAsync(f),
              ns = Object.keys(z.files)
                .filter((n) =>
                  ext === "docx"
                    ? n === "word/document.xml"
                    : /^ppt\/slides\/slide\d+\.xml$/.test(n),
                )
                .sort((a, b) => a.localeCompare(b, undefined, { numeric: true })),
              out = [];
            for (const n of ns) {
              const x = await z.file(n).async("string");
              out.push(
                x
                  .replace(/<\/(w:p|a:p)>/g, "\n")
                  .replace(/<(w:br|w:tab)[^>]*\/>/g, " ")
                  .replace(/<[^>]+>/g, "")
                  .replace(/&lt;/g, "<")
                  .replace(/&gt;/g, ">")
                  .replace(/&quot;/g, '"')
                  .replace(/&apos;/g, "'")
                  .replace(/&amp;/g, "&"),
              );
            }
            blob = new Blob([out.join("\n\n")], { type: "text/plain" });
            name += ".txt";
          } else if (ext === "pdf") blob = new Blob([f], { type: "application/pdf" });
          else if (ext === "txt") blob = new Blob([f], { type: "text/plain" });
          else if (ext === "md") blob = new Blob([f], { type: "text/markdown" });
          else {
            toast("Use txt, md, pdf, docx or pptx (convert old .doc/.ppt first)");
            return;
          }
          toast("Uploading…");
          const r = await uploadBytes(
              sRef(storage, `files/${room}/${Date.now()}-${name.replace(/[^\w.\-]+/g, "_")}`),
              blob,
            ),
            url = await getDownloadURL(r.ref);
          if (!R || R.id !== room) return;
          D.fl[q] = [...(D.fl[q] || []), { url, name }];
          mark("fl", q);
          page();
          toast(ext === "docx" || ext === "pptx" ? "Attached (text extracted)" : "Attached ✓");
        } catch (e) {
          toast("Upload failed:" + why(e));
        }
      }

      /* ---- start ---- */
      (async () => {
        try {
          await signInAnonymously(auth);
        } catch (e) {
          $("#main").innerHTML =
            `<div class="hero empty"><h2>🔒 Sign-in failed</h2><p>${esc(why(e))}</p><p>Enable Anonymous sign-in in Firebase → Authentication.</p></div>`;
          return;
        }
        let last = null;
        try {
          last = JSON.parse(ls.get("room") || "null");
        } catch (e) {}
        if (last && last.key && last.name) openRoom(last.key, last.name);
        else render();
      })();
    </script>
  </body>
</html>
